spring:
  datasource:
    url: jdbc:h2:mem:placement_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # This profile is an ephemeral in-memory H2 scratch database that Hibernate
  # builds from scratch on every run (create-drop). Flyway's baseline DDL is
  # PostgreSQL-specific and there is no data worth baselining, so migrations are
  # disabled here. Real PostgreSQL environments (local, test, prod) use Flyway.
  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: ${JWT_SECRET:dev-only-secret-minimum-32-characters-long-for-hmac}
  expiration-ms: 86400000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}
