spring:
  application:
    name: placement-portal

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080

logging:
  level:
    com.college.placement: INFO
    org.springframework.security: WARN

app:
  seed-bulk-demo-data: ${SEED_BULK_DEMO_DATA:false}
  seed-bulk-demo-cleanup: ${SEED_BULK_DEMO_CLEANUP:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
