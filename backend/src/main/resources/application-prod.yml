spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/placement_portal}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 100
          order_inserts: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:change-me-to-a-secure-256-bit-key}
  expiration-ms: 86400000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

logging:
  level:
    com.college.placement: INFO
    org.hibernate.SQL: WARN
